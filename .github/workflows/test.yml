name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv

  typescript:
    name: Analysis and listener
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            analysis/package-lock.json
            listener/package-lock.json

      - name: Install analysis dependencies
        run: npm ci
        working-directory: analysis

      - name: Type-check analysis
        run: npm run build
        working-directory: analysis

      - name: Test analysis
        run: npm test
        working-directory: analysis

      - name: Install listener dependencies
        run: npm ci
        working-directory: listener

      - name: Type-check listener
        run: npm run build -- --noEmit
        working-directory: listener

      - name: Install Foundry for listener execution tests
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build current test executor
        run: forge build src/BotVM.sol

      - name: Test installed listener families
        working-directory: listener
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: |
          if [ -n "$MAINNET_RPC_URL" ]; then
            export FAMILY_TEST_RPC_FILE="$RUNNER_TEMP/family-rpc.json"
            node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync(process.env.FAMILY_TEST_RPC_FILE, JSON.stringify({MAINNET_RPC_URL:process.env.MAINNET_RPC_URL}), {mode:0o600});'
            npm test -- --rpc-file "$FAMILY_TEST_RPC_FILE" --executor-code-mode counterfactual --simulation-method eth_simulateV1 --out "$RUNNER_TEMP/family-facts"
          else
            npm test -- --out "$RUNNER_TEMP/family-facts"
          fi

      - name: Retain family test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-facts
          path: ${{ runner.temp }}/family-facts
          if-no-files-found: ignore
