[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true

# Explicit benchmark profile; default/deployed build settings stay unchanged.
[profile.executor_gas]
optimizer_runs = 10000
out = "logs/executor-gas/out"

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"

[fmt]
line_length = 120
tab_width = 4
