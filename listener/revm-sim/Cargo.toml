[package]
name = "revm-sim"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
reqwest = { version = "0.12", features = ["blocking", "json"] }
revm = { version = "40.0.3", features = ["optional_eip3607"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
